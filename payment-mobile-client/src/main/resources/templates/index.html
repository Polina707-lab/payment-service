<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оплата сервиса</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card { border-radius: 15px; }
        textarea { font-family: monospace; font-size: 14px; }
    </style>
</head>
<body>
<div class="container mt-4 mb-5">
    <h2 class="text-center mb-4">Мобильная оснастка<br><small class="text-muted fs-5">Сервис оплаты</small></h2>

	<div class="text-center mb-3">
        <a href="/subscriptions" class="btn btn-outline-dark">Посмотреть актуальные данные</a>
    </div>

    <div th:if="${error}" class="alert alert-danger">
        <p th:text="${error}"></p>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Оформить подписку</h5>
        </div>
        <div class="card-body">
            <form action="/pay" method="post">
                <div class="mb-3">
                    <label class="form-label">ID Сервиса (ServiceID)</label>
                    <input type="number" class="form-control" name="serviceId" value="1" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Имя метода</label>
                    <input type="text" class="form-control" name="methodName" value="getData" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Оплатить на (дней)</label>
                    <input type="number" class="form-control" name="days" value="30" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Оплатить</button>
            </form>
        </div>
    </div>

    <div th:if="${token}" class="card shadow-sm mb-4 border-success">
        <div class="card-header bg-success text-white">
            <h5 class="mb-0">Оплата прошла успешно!</h5>
        </div>
        <div class="card-body">
            <p><strong>ID подписки:</strong> <span th:text="${subscriptionId}"></span></p>
            <p><strong>Статус:</strong> <span th:text="${status}"></span></p>
            <label class="form-label fw-bold">Ваш токен (скопируйте его):</label>
            <textarea class="form-control" rows="3" th:text="${token}" readonly></textarea>
        </div>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-header bg-secondary text-white">
            <h5 class="mb-0">Проверить токен</h5>
        </div>
        <div class="card-body">
            <form action="/validate" method="post">
                <div class="mb-3">
                    <label class="form-label">ID Сервиса</label>
                    <input type="number" class="form-control" name="serviceId" th:value="${serviceId}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Имя метода</label>
                    <input type="text" class="form-control" name="methodName" th:value="${methodName}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Токен</label>
                    <textarea class="form-control" name="token" rows="3" th:text="${token}" required></textarea>
                </div>
                <button type="submit" class="btn btn-dark w-100">Проверить</button>
            </form>
        </div>
    </div>

    <div th:if="${verdict}" class="alert alert-info">
        <h5>Результат проверки</h5>
        <p><strong>Вердикт:</strong> <span th:text="${verdict}" class="fw-bold"></span></p>
        <small class="text-muted">Проверяемый токен: <span th:text="${checkedToken}"></span></small>
    </div>

    <div th:if="${validateError}" class="alert alert-warning">
        <p th:text="${validateError}"></p>
    </div>

</div>
</body>
</html>
