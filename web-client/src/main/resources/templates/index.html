<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сервис оплаты</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card { border-radius: 15px; }
    </style>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0d6efd">
</head>
<body>
<div class="container mt-5">
    <div class="text-center mb-5">
        <h2 class="mb-3">Мобильная оснастка<br><small class="text-muted fs-5">Сервис оплаты</small></h2>
        <p class="text-muted">Приложение для просмотра актуальных данных</p>
    </div>

    <div class="card shadow-sm mx-auto" style="max-width: 500px;">
        <div class="card-body text-center p-5">
            <h4 class="card-title mb-4">Просмотр подписок</h4>
            <p class="card-text mb-4">Нажмите кнопку ниже, чтобы загрузить список всех оформленных подписок из базы данных сервиса.</p>
            <a href="/subscriptions" class="btn btn-primary btn-lg w-100">Посмотреть актуальные данные</a>
        </div>
    </div>
</div>

<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js');
    }
</script>

</body>
</html>
