<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Актуальные данные</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .table-responsive { background: white; border-radius: 10px; padding: 15px; }
    </style>
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3>Актуальные данные</h3>
        <a href="/" class="btn btn-outline-primary">Назад</a>
    </div>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="table-responsive shadow-sm">
        <table class="table table-hover">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Сервис</th>
                <th>Метод</th>
                <th>Действует до</th>
                <th>Токен</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="sub : ${subscriptions}">
                <td th:text="${sub.id}"></td>
                <td th:text="${sub.serviceId}"></td>
                <td th:text="${sub.methodName}"></td>
                <td th:text="${#dates.format(sub.validTo, 'dd.MM.yyyy')}"></td>
                <td><small th:text="${sub.token}"></small></td>
            </tr>
            <tr th:if="${#lists.isEmpty(subscriptions)}">
                <td colspan="5" class="text-center text-muted">Нет данных</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
